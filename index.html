<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perspective Practice</title>
    <style>
        /* Removes all browser margins and scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            overflow: hidden;
        }
        /* Forces the canvas to perfectly fill the screen */
        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            outline: none;
            cursor: none;
            touch-action: none;
        }
    </style>
</head>
<body>
    <!-- The canvas Emscripten will draw to -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <!-- Tell Emscripten to use our canvas, then load the app -->
    <script type="text/javascript">
        var Module = {
        canvas: document.getElementById('canvas')
        };
    </script>
    <script src="PerspectivePractice.js"></script>
</body>
</html>
